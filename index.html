<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;900&family=Inconsolata:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>

    <symbol id="icon-hammer" viewBox="0 0 32 32" fill="none">
      <rect x="2" y="6" width="18" height="8" rx="1.5" fill="currentColor"/>
      <line x1="16" y1="13" x2="29" y2="28" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      <rect x="2" y="6" width="5" height="8" rx="1" fill="currentColor" opacity="0.5"/>
    </symbol>

    <symbol id="icon-person-add" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="6" r="3"/>
      <path d="M2 17c0-3.314 2.686-5 6-5"/>
      <path d="M15 11v6M12 14h6"/>
    </symbol>

    <symbol id="icon-bell" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 2a6 6 0 0 1 6 6v3l1.5 2.5H2.5L4 11V8a6 6 0 0 1 6-6z"/>
      <path d="M8.5 17a1.5 1.5 0 0 0 3 0"/>
    </symbol>

    <symbol id="icon-users" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="7" cy="7" r="3"/>
      <path d="M1 17c0-3 2.5-5 6-5s6 2 6 5"/>
      <path d="M13.5 5a3 3 0 1 1 0 4M17 17c0-2.5-1.5-4.5-3.5-5"/>
    </symbol>

    <symbol id="icon-send" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 3 3 9l5 2 2 5 7-13z"/>
      <path d="M8 11l4-4"/>
    </symbol>

    <symbol id="icon-signout" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4"/>
      <path d="M13 14l4-4-4-4"/>
      <path d="M17 10H7"/>
    </symbol>

    <symbol id="icon-remove" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="6" r="3"/>
      <path d="M2 17c0-3.314 2.686-5 6-5"/>
      <path d="M13 13l4 4M17 13l-4 4"/>
    </symbol>

    <symbol id="icon-image" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="16" height="12" rx="1.5"/>
      <circle cx="7" cy="8" r="1.5"/>
      <path d="M2 14l4-4 3 3 3-3 6 5"/>
    </symbol>

    <symbol id="icon-chat" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8a2 2 0 0 1 2-2h24a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H14l-8 6V8z"/>
      <path d="M13 15h14M13 21h8"/>
    </symbol>

    <symbol id="icon-settings" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="10" cy="10" r="2.5"/>
  <path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4M13.9 13.9l1.4 1.4M6.1 6.1l-1.4-1.4"/>
</symbol>

<symbol id="icon-user" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="10" cy="7" r="3"/>
  <path d="M3 17c0-3.314 2.686-6 6-6h2c3.314 0 6 2.686 6 6"/>
</symbol>

<symbol id="icon-admin" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10 2.5L3 6v4c0 4 3 7 7 7s7-3 7-7V6l-7-3.5z"/>
  <path d="M10 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
  <path d="M12 12l-2 2-2-2"/>
</symbol>
  </defs>
</svg>

</head>
<body>
<div id="sparks" aria-hidden="true"></div>

<section id="auth-screen" class="screen auth-screen">
  <div class="auth-card">
    <div class="brand">
      <svg class="logo-mark" aria-hidden="true"><use href="#icon-hammer"/></svg>
      <h1>FORGECHAT</h1>
    </div>
    <p class="tagline">where words get hammered out</p>

    <div class="auth-tabs" role="tablist">
      <button class="tab-btn active" id="tab-signin" role="tab" aria-selected="true" type="button">Sign In</button>
      <button class="tab-btn" id="tab-signup" role="tab" aria-selected="false" type="button">Sign Up</button>
    </div>

    <form id="signin-form" class="auth-form">
      <label for="signin-email">Email</label>
      <input type="email" id="signin-email" required autocomplete="email">
      <label for="signin-password">Password</label>
      <input type="password" id="signin-password" required autocomplete="current-password">
      <button type="submit" class="btn-primary">Enter the forge</button>
    </form>

    <form id="signup-form" class="auth-form hidden">
      <label for="signup-username">Username</label>
      <input type="text" id="signup-username" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+">
      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" required autocomplete="email">
      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
      <button type="submit" class="btn-primary">Forge an account</button>
    </form>

    <p id="auth-message" class="auth-message" role="status"></p>
  </div>
</section>

<section id="app-shell" class="screen hidden">
  <header class="topbar">
    <div class="brand-small">
      <svg class="logo-mark-sm" aria-hidden="true"><use href="#icon-hammer"/></svg>
      <span>FORGECHAT</span>
    </div>
    <div class="topbar-right">
  <span id="current-username" class="current-username"></span>
  <span id="streak-display" class="streak-display"></span>
  <button id="profile-settings-btn" class="btn-ghost" type="button" title="Edit profile">
    <svg class="btn-icon" aria-hidden="true"><use href="#icon-settings"/></svg>
  </button>
  <button id="admin-panel-btn" class="btn-ghost admin-only" type="button" title="Admin Panel">
  <svg class="btn-icon" aria-hidden="true"><use href="#icon-admin"/></svg>
</button>
  <button id="signout-btn" class="btn-ghost" type="button">
    <svg class="btn-icon" aria-hidden="true"><use href="#icon-signout"/></svg>
    Sign Out
  </button>
</div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-block">
        <h2>
          <svg class="section-icon" aria-hidden="true"><use href="#icon-person-add"/></svg>
          Add Friend
        </h2>
        <form id="add-friend-form" class="add-friend-form">
          <input id="add-friend-input" type="text" placeholder="Username..." autocomplete="off">
          <button class="btn-ember" type="submit">Add</button>
        </form>
        <div id="add-friend-autocomplete" class="autocomplete-list hidden"></div>
        <p id="add-friend-message" class="inline-message"></p>
      </div>

      <div class="sidebar-block">
        <h2>
          <svg class="section-icon" aria-hidden="true"><use href="#icon-bell"/></svg>
          Requests
          <span id="request-count" class="count-badge hidden">0</span>
        </h2>
        <ul id="requests-list" class="requests-list"></ul>
      </div>

      <div class="sidebar-block sidebar-block-grow">
        <h2>
          <svg class="section-icon" aria-hidden="true"><use href="#icon-users"/></svg>
          Friends
        </h2>
        <ul id="friends-list" class="friends-list"></ul>
      </div>
      <div class="sidebar-block" id="my-profile-block">
  <h2>
    <svg class="section-icon" aria-hidden="true"><use href="#icon-user"/></svg>
    My Profile
  </h2>
  <div id="my-profile-display" class="my-profile-display">
    <div class="my-profile-avatar-wrapper">
      <span id="my-profile-avatar" class="friend-avatar-letter">?</span>
    </div>
    <div class="my-profile-info">
      <span id="my-profile-username" class="my-profile-username"></span>
      <span id="my-profile-status" class="my-profile-status"></span>
      <span id="my-profile-bio" class="my-profile-bio"></span>
    </div>
    <button id="my-profile-edit-btn" class="btn-ghost" type="button">Edit</button>
  </div>
</div>
    </aside>

    <main class="chat-panel">
      <div id="chat-empty" class="chat-empty">
        <div class="chat-empty-inner">
          <svg class="empty-icon" aria-hidden="true"><use href="#icon-chat"/></svg>
          <p>Pick a friend from the roster to start chatting ok?</p>
        </div>
      </div>
      <div id="chat-active" class="chat-active hidden">
        <div class="chat-header">
          <div class="chat-header-left">
  <div class="chat-header-avatar-wrapper">
    <span id="chat-friend-avatar" class="chat-avatar-letter">?</span>
  </div>
  <div>
    <span id="chat-friend-name"></span>
    <span id="chat-friend-status" class="chat-friend-status status-offline">Offline</span>
    <span id="chat-friend-status-msg" class="chat-friend-status-msg"></span>
  </div>
</div>
          <button id="remove-friend-btn" class="btn-remove-friend" type="button" title="Remove friend">
            <svg class="btn-icon" aria-hidden="true"><use href="#icon-remove"/></svg>
            Remove
          </button>
        </div>
        <div id="messages" class="messages"></div>
        <div id="typing-indicator" class="typing-indicator hidden" aria-live="polite">
          <div class="typing-dots">
            <span></span><span></span><span></span>
          </div>
          <span class="typing-label">typing</span>
        </div>
        <form id="message-form" class="message-form">
          <label class="img-upload-label" title="Send image" aria-label="Attach image">
            <svg class="btn-icon" aria-hidden="true"><use href="#icon-image"/></svg>
            <input type="file" id="image-input" accept="image/*" style="display:none">
          </label>
          <input type="text" id="message-input" placeholder="Say something..." autocomplete="off">
          <button type="submit" class="btn-ember" aria-label="Send message">
            <svg class="btn-icon" aria-hidden="true"><use href="#icon-send"/></svg>
            Send
          </button>
        </form>
      </div>
    </main>
  </div>
</section>

<div id="profile-modal" class="modal hidden">
  <div class="modal-overlay"></div>
  <div class="modal-card">
    <button id="modal-close-btn" class="modal-close" type="button">&times;</button>
    <h2>Edit Profile</h2>
    <form id="profile-form" enctype="multipart/form-data">
      <label for="profile-avatar-upload">Avatar</label>
      <div class="avatar-upload-wrapper">
        <img id="profile-avatar-preview" class="profile-avatar-preview" src="" alt="Avatar preview">
        <input type="file" id="profile-avatar-upload" accept="image/*">
        <button type="button" id="remove-avatar-btn" class="btn-ghost" style="margin-top:6px;">Remove Avatar</button>
      </div>
      <label for="profile-bio">Bio</label>
      <textarea id="profile-bio" rows="2" placeholder="Tell us about yourself..."></textarea>
      <label for="profile-status">Status message</label>
      <input type="text" id="profile-status" placeholder="Eating pizza 🍕" maxlength="60">
      <button type="submit" class="btn-primary">Save Profile</button>
    </form>
    <p id="profile-message" class="auth-message"></p>
  </div>
</div>

<div id="admin-modal" class="modal hidden">
  <div class="modal-overlay"></div>
  <div class="modal-card" style="max-width:600px;">
    <button id="admin-modal-close" class="modal-close" type="button">&times;</button>
    <h2>Admin Panel</h2>
    <div class="admin-search">
  <input type="text" id="admin-search-input" placeholder="Search users by username..." autocomplete="off">
</div>
<div id="admin-results" class="admin-results"></div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
